name: Update shows daily

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC (7am Austin)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch shows
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: python fetch_shows.py
      - name: Commit changes
        run: |
          git config user.name "show-bot"
          git config user.email "show-bot@users.noreply.github.com"
          git add shows.json
          git diff --staged --quiet || git commit -m "Update shows"
          git push
